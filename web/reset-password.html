<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f1e7">
  <meta name="description" content="Atur kata sandi baru untuk akun gibahin.id.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=27">
  <title>Atur ulang kata sandi · gibahin.id</title>
</head>
<body class="reset-body">
  <main class="reset-page">
    <div class="reset-orbit reset-orbit-one" aria-hidden="true"></div>
    <div class="reset-orbit reset-orbit-two" aria-hidden="true"></div>
    <a class="brand reset-brand" href="/" aria-label="gibahin.id, kembali ke masuk"><span class="brand-mark">g.</span><span>gibahin.id</span></a>
    <section class="reset-card" aria-labelledby="resetTitle">
      <div class="reset-seal"><svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#lock"></use></svg></div>
      <span class="eyebrow">PULIHKAN AKUN</span>
      <h1 id="resetTitle">Buat kata sandi baru</h1>
      <p class="reset-intro">Pilih kata sandi yang mudah kamu ingat dan sulit ditebak orang lain.</p>
      <form id="passwordResetForm" class="reset-form">
        <label>Kata sandi baru<input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Minimal 8 karakter" required></label>
        <label>Ulangi kata sandi baru<input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Ketik ulang kata sandi" required></label>
        <p id="resetStatus" class="reset-status hidden" role="status" aria-live="polite"></p>
        <button id="confirmResetBtn" class="primary full" type="submit">Konfirmasi perubahan <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#arrow"></use></svg></button>
      </form>
      <p id="resetSuccess" class="reset-success hidden" role="status">Kata sandi berhasil diganti. Sekarang kamu bisa masuk kembali.</p>
      <a class="reset-back-link" href="/">Kembali ke masuk <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#arrow"></use></svg></a>
    </section>
    <small class="reset-foot">gibahin.id · Ruang yang terasa dekat.</small>
  </main>
  <script src="/reset-password.js?v=2" defer></script>
</body>
</html>
